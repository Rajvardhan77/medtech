<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedLens — Clinical Information Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8FAFC;
    --paper-raised:#FFFFFF;
    --paper-sunken:#F1F5F9;
    --ink:#0F172A;
    --ink-soft:#475569;
    --ink-faint:#94A3B8;
    --line:#E2E8F0;
    --line-strong:#CBD5E1;
    --teal:#0D9488;
    --teal-deep:#0F766E;
    --teal-soft:#F0FDFA;
    --teal-border:#99F6E4;
    --violet:#7C3AED;
    --violet-soft:#F5F3FF;
    --violet-border:#DDD6FE;
    --flag-high:#DC2626;
    --flag-high-bg:#FEF2F2;
    --flag-high-border:#FECACA;
    --flag-low:#2563EB;
    --flag-low-bg:#EFF6FF;
    --flag-low-border:#BFDBFE;
    --flag-normal:#16A34A;
    --flag-normal-bg:#F0FDF4;
    --flag-normal-border:#BBF7D0;
    --flag-unknown:#D97706;
    --flag-unknown-bg:#FFFBEB;
    --flag-unknown-border:#FDE68A;
    --danger:#DC2626;
    --radius-sm:4px;
    --radius:6px;
    --radius-lg:10px;
    --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.05);
    --shadow:0 1px 3px 0 rgba(0,0,0,0.08), 0 1px 2px -1px rgba(0,0,0,0.05);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:600;
    color:var(--ink);
    margin:0;
    letter-spacing:-0.015em;
  }
  .mono{font-family:'IBM Plex Mono', SFMono-Regular, Consolas, monospace;}
  a{color:var(--teal);text-decoration:none;}
  a:hover{text-decoration:underline;}
  button{font-family:inherit;cursor:pointer;}
  input, select, textarea{font-family:inherit;font-size:14px;}
  ::selection{background:var(--teal-soft);color:var(--teal-deep);}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  #app{min-height:100vh;}

  /* ---------- Lock / setup screens ---------- */
  .gate-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);
    padding:24px;
  }
  .gate-card{
    width:100%;max-width:400px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
    padding:40px 36px;
  }
  .gate-mark{
    font-family:'Source Serif 4',serif;font-weight:600;font-size:24px;
    display:flex;align-items:baseline;gap:8px;margin-bottom:6px;
  }
  .gate-mark span{color:var(--teal);}
  .gate-sub{color:var(--ink-soft);font-size:13px;margin-bottom:28px;line-height:1.45;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.01em;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 12px;border:1px solid var(--line-strong);
    border-radius:var(--radius);background:#fff;color:var(--ink);
    font-size:13.5px;box-shadow:var(--shadow-sm);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(13,148,136,0.15);
  }
  .field textarea{resize:vertical;min-height:90px;line-height:1.5;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 16px;border-radius:var(--radius);border:1px solid var(--teal);
    background:var(--teal);color:#fff;font-size:13.5px;font-weight:500;
    transition:all .15s ease;box-shadow:var(--shadow-sm);letter-spacing:0.01em;
  }
  .btn:hover{background:var(--teal-deep);border-color:var(--teal-deep);box-shadow:var(--shadow);}
  .btn-outline{background:#fff;color:var(--ink-soft);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm);}
  .btn-outline:hover{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-soft);}
  .btn-quiet{background:transparent;color:var(--ink-soft);border:1px solid transparent;padding:6px 10px;border-radius:var(--radius-sm);}
  .btn-quiet:hover{color:var(--ink);background:var(--paper-sunken);text-decoration:none;}
  .btn-danger{border-color:var(--danger);background:#fff;color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .gate-error{color:var(--flag-high);font-size:12.5px;margin-bottom:14px;min-height:1em;font-weight:500;}
  .gate-foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-faint);line-height:1.45;}

  /* ---------- Shell layout ---------- */
  .shell{display:flex;min-height:100vh;}
  .rail{
    width:256px;flex:none;border-right:1px solid var(--line);
    background:var(--paper-raised);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .rail-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);}
  .rail-mark{font-family:'Source Serif 4',serif;font-size:20px;font-weight:600;display:flex;align-items:baseline;gap:7px;}
  .rail-mark span{color:var(--teal);}
  .rail-tag{font-size:11px;color:var(--ink-faint);margin-top:2px;letter-spacing:.02em;}
  .rail-actions{padding:16px 16px 10px;}
  .rail-search{padding:0 16px 10px;}
  .rail-search input{
    width:100%;padding:7px 10px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--paper);font-size:12.5px;
    box-shadow:none;
  }
  .rail-search input:focus{background:#fff;border-color:var(--teal);}
  .rail-nav{padding:4px 10px;}
  .rail-nav button{
    width:100%;text-align:left;background:none;border:none;padding:8px 10px;
    font-size:13px;color:var(--ink-soft);border-radius:var(--radius);
    display:flex;align-items:center;gap:8px;font-weight:500;
  }
  .rail-nav button:hover{background:var(--paper-sunken);color:var(--ink);}
  .rail-nav button.active{background:var(--teal-soft);color:var(--teal-deep);font-weight:600;}
  .rail-section-label{font-size:10.5px;letter-spacing:.06em;color:var(--ink-faint);padding:14px 20px 6px;text-transform:uppercase;font-weight:600;}
  .patient-list{flex:1;overflow-y:auto;padding:2px 10px 14px;}
  .patient-item{
    width:100%;text-align:left;background:none;border:none;padding:10px 12px;
    border-radius:var(--radius);display:block;transition:all .12s ease;
  }
  .patient-item:hover{background:var(--paper-sunken);}
  .patient-item.active{background:var(--teal-soft);border-left:3px solid var(--teal);}
  .patient-item .pn{font-size:13.5px;color:var(--ink);font-weight:600;}
  .patient-item .pm{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .rail-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);line-height:1.4;}

  .top-disclaimer-bar{
    background:#FFFFFF;border-bottom:1px solid var(--line);
    padding:10px 44px;display:flex;align-items:center;justify-content:space-between;
  }
  .disclaimer-inner{display:flex;align-items:center;gap:12px;max-width:1000px;}
  .disclaimer-badge{
    font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    background:var(--paper-sunken);color:var(--ink-soft);border:1px solid var(--line-strong);
    padding:2px 8px;border-radius:var(--radius-sm);flex-shrink:0;
  }
  .disclaimer-text{color:var(--ink-faint);font-size:12px;}

  .main{flex:1;min-width:0;padding:36px 44px 80px;max-width:1000px;}
  .empty-state{padding:80px 20px;text-align:center;color:var(--ink-faint);}
  .empty-state h3{color:var(--ink-soft);margin-bottom:8px;font-size:18px;}

  /* ---------- Dossier header ---------- */
  .dossier-head{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px;}
  .dossier-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .dossier-name{font-size:26px;letter-spacing:-0.02em;}
  .dossier-meta{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .chip{
    font-size:11.5px;padding:3px 10px;border-radius:14px;border:1px solid var(--line-strong);
    color:var(--ink-soft);background:var(--paper-raised);font-weight:500;
  }
  .chip.warn{border-color:var(--flag-high-border);color:var(--flag-high);background:var(--flag-high-bg);font-weight:600;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .tab-btn{
    background:none;border:none;padding:10px 14px;font-size:13.5px;font-weight:500;
    color:var(--ink-faint);border-bottom:2px solid transparent;position:relative;top:1px;
    border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:all .12s ease;
  }
  .tab-btn:hover{color:var(--ink-soft);background:var(--paper-sunken);}
  .tab-btn.active{color:var(--teal-deep);border-bottom-color:var(--teal);font-weight:600;}

  section.block{margin-bottom:32px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .block-head h3{font-size:16px;letter-spacing:-0.01em;}
  .block-sub{color:var(--ink-faint);font-size:12.5px;margin-top:-6px;margin-bottom:14px;line-height:1.45;}

  .card{border:1px solid var(--line);background:var(--paper-raised);padding:22px 24px;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px;}
  .kv-grid .kv-item{border-bottom:1px solid var(--line);padding-bottom:10px;}
  .kv-label{font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .kv-val{font-size:14px;color:var(--ink);font-weight:500;}
  .kv-val.empty{color:var(--ink-faint);font-style:italic;font-weight:400;}

  .prov{
    display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:12px;margin-left:6px;vertical-align:middle;
    border:1px solid var(--line-strong);color:var(--ink-soft);background:var(--paper-sunken);
    font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;
  }
  .prov.ai{color:#6B21A8;border-color:var(--violet-border);background:var(--violet-soft);}
  .prov.user{color:var(--teal-deep);border-color:var(--teal-border);background:var(--teal-soft);}
  .prov.edited{color:#92400E;border-color:#FDE68A;background:#FEF3C7;}

  table.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;}
  table.data-table th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-faint);padding:10px 14px;border-bottom:1px solid var(--line-strong);
    background:var(--paper);font-weight:600;
  }
  table.data-table th:first-child{border-top-left-radius:var(--radius-sm);}
  table.data-table th:last-child{border-top-right-radius:var(--radius-sm);}
  table.data-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.data-table tr:hover td{background:rgba(240,253,250,0.4);}
  table.data-table tr:last-child td{border-bottom:none;}

  .flag-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:3px 10px;border-radius:14px;border:1px solid transparent;
    font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;box-shadow:var(--shadow-sm);
  }
  .flag-pill .dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .flag-high, .flag-critical_high{background:var(--flag-high-bg);color:var(--flag-high);border-color:var(--flag-high-border);}
  .flag-high .dot, .flag-critical_high .dot{background:var(--flag-high);box-shadow:0 0 0 2px rgba(220,38,38,0.2);}
  .flag-low, .flag-critical_low{background:var(--flag-low-bg);color:var(--flag-low);border-color:var(--flag-low-border);}
  .flag-low .dot, .flag-critical_low .dot{background:var(--flag-low);box-shadow:0 0 0 2px rgba(37,99,235,0.2);}
  .flag-normal{background:var(--flag-normal-bg);color:var(--flag-normal);border-color:var(--flag-normal-border);}
  .flag-normal .dot{background:var(--flag-normal);}
  .flag-unknown, .flag-not_provided_in_source{background:var(--flag-unknown-bg);color:var(--flag-unknown);border-color:var(--flag-unknown-border);}
  .flag-unknown .dot, .flag-not_provided_in_source .dot{background:var(--flag-unknown);}

  .conf-bar{width:56px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
  .conf-bar > div{height:100%;background:var(--teal);}
  .conf-label{font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}

  .trend{font-size:12px;font-weight:500;}
  .trend.up{color:var(--flag-high);}
  .trend.down{color:var(--flag-low);}
  .trend.flat{color:var(--ink-faint);}

  .icon-btn{background:none;border:none;color:var(--ink-faint);font-size:12px;padding:4px 8px;border-radius:var(--radius-sm);transition:all .12s ease;}
  .icon-btn:hover{color:var(--teal);background:var(--teal-soft);}

  .report-card{border:1px solid var(--line);margin-bottom:20px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);background:#fff;}
  .report-card-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line);
  }
  .report-card-head .rt{font-weight:600;font-size:14px;}
  .report-card-head .rd{font-size:12px;color:var(--ink-faint);}
  .report-card-body{padding:16px 18px;}
  .source-toggle{padding:12px 18px;border-top:1px solid var(--line);background:var(--paper-raised);}
  .raw-view{
    white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;
    color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);
    padding:12px 14px;border-radius:var(--radius);max-height:280px;overflow:auto;line-height:1.45;
  }
  .side-by-side{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:800px){.side-by-side{grid-template-columns:1fr;}}

  .conflict-item{
    display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start;
  }
  .conflict-item:last-child{border-bottom:none;}
  .sev-badge{
    flex:none;width:68px;height:24px;border-radius:14px;font-size:10.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.04em;
    font-family:'IBM Plex Mono',monospace;
  }
  .sev-high{background:var(--flag-high-bg);color:var(--flag-high);border:1px solid var(--flag-high-border);}
  .sev-medium{background:var(--flag-unknown-bg);color:var(--flag-unknown);border:1px solid var(--flag-unknown-border);}
  .sev-low{background:var(--flag-low-bg);color:var(--flag-low);border:1px solid var(--flag-low-border);}

  .timeline{border-left:2px solid var(--line-strong);margin-left:8px;padding-left:22px;}
  .timeline-item{position:relative;padding-bottom:22px;}
  .timeline-item::before{
    content:'';position:absolute;left:-28px;top:4px;width:10px;height:10px;border-radius:50%;
    background:var(--teal);border:2px solid var(--paper-raised);box-shadow:0 0 0 2px var(--teal-border);
  }
  .timeline-ts{font-size:11.5px;color:var(--ink-faint);margin-bottom:3px;font-family:'IBM Plex Mono',monospace;}
  .timeline-action{font-size:13.5px;color:var(--ink);font-weight:500;}

  .summary-box{
    border:1px solid var(--teal-border);background:var(--teal-soft);padding:22px 24px;border-radius:var(--radius-lg);
    font-size:14px;line-height:1.65;color:var(--teal-deep);white-space:pre-wrap;box-shadow:var(--shadow-sm);
  }
  .disclaimer{
    margin-top:16px;font-size:12px;color:var(--ink-soft);border-top:1px dashed var(--line-strong);
    padding-top:12px;line-height:1.45;
  }
  .disclaimer strong{color:var(--ink);}

  .banner{
    display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);
    font-size:13px;margin-bottom:18px;line-height:1.45;box-shadow:var(--shadow-sm);
  }
  .banner.info{background:var(--teal-soft);color:var(--teal-deep);border:1px solid var(--teal-border);}
  .banner.error{background:var(--flag-high-bg);color:var(--flag-high);border:1px solid var(--flag-high-border);}
  .banner.loading{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);}

  .row-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .file-drop{
    border:2px dashed var(--line-strong);border-radius:var(--radius);padding:24px 20px;text-align:center;
    color:var(--ink-faint);font-size:13px;cursor:pointer;background:var(--paper);transition:all .15s ease;
  }
  .file-drop:hover{border-color:var(--teal);color:var(--teal-deep);background:#fff;}
  .file-drop input{display:none;}

  .edit-input{
    width:100%;padding:5px 8px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);font-size:13px;
    font-family:'IBM Plex Mono',monospace;background:#fff;
  }

  .search-hit{border-bottom:1px solid var(--line);padding:14px 0;}
  .search-hit .sh-pt{font-size:13.5px;font-weight:600;}
  .search-hit .sh-ctx{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

  @media print{
    .rail, .tabs, .row-actions, .no-print, .top-disclaimer-bar{display:none !important;}
    .main{max-width:100%;padding:0;}
    body{background:#fff;}
  }

  @media (max-width:820px){
    .shell{flex-direction:column;}
    .rail{position:static;width:100%;height:auto;}
    .main{padding:24px;}
    .kv-grid{grid-template-columns:1fr;}
    .top-disclaimer-bar{padding:8px 24px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   UTILITIES
   ========================================================================= */
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(prefix){
  return (prefix||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
}
function nowIso(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d=new Date(iso);
    return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})+' '+
           d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}
function fmtDateShort(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return iso; }
}
async function sha256(text){
  const enc=new TextEncoder().encode(text);
  const buf=await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function debounce(fn, ms){
  let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); };
}
function num(v){ const n=parseFloat(v); return isNaN(n)?null:n; }

/* =========================================================================
   STORAGE LAYER  (all patient data is PERSONAL / non-shared)
   ========================================================================= */
const Store = {
  async get(key){
    try{
      if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
        const r = await window.storage.get(key, false);
        return r ? JSON.parse(r.value) : null;
      }
      const item = localStorage.getItem('medlens:' + key);
      return item ? JSON.parse(item) : null;
    } catch(e){ return null; }
  },
  async set(key, value){
    try{
      if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(key, JSON.stringify(value), false);
        return true;
      }
      localStorage.setItem('medlens:' + key, JSON.stringify(value));
      return true;
    } catch(e){ console.error('storage set failed', e); return false; }
  },
  async delete(key){
    try{
      if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.delete === 'function'){
        await window.storage.delete(key, false);
        return true;
      }
      localStorage.removeItem('medlens:' + key);
      return true;
    } catch(e){ return false; }
  },
  async list(prefix){
    try{
      if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.list === 'function'){
        const r = await window.storage.list(prefix, false);
        return r ? r.keys : [];
      }
      const keys = [];
      const pfx = 'medlens:' + (prefix || '');
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(pfx)){
          keys.push(k.slice('medlens:'.length));
        }
      }
      return keys;
    } catch(e){ return []; }
  }
};

async function authenticateWithApi(passcode){
  const clean = (passcode || '').trim();
  const email = (clean.includes('@') ? clean : `patient_${clean.toLowerCase().replace(/[^a-z0-9]/g, '') || 'demo'}@medlens.dev`);
  const password = clean.length >= 8 ? clean : `${clean}Pass123!`;

  let resp = await fetch('http://localhost:4000/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, role: 'patient' })
  });

    resp = await fetch('http://localhost:4000/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
  }

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || 'Authentication failed with status ' + resp.status);
  }

  const data = await resp.json();
  authToken = data.token;
  return data;
}

/* =========================================================================
   CLAUDE API (via Anthropic /v1/messages — key injected by host, never by us)
   ========================================================================= */
const MODEL = 'claude-sonnet-4-6';

async function callClaude(messages, opts){
  opts = opts || {};
  const body = {
    model: MODEL,
    max_tokens: opts.maxTokens || 1000,
    messages: messages
  };
  if(opts.system) body.system = opts.system;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!resp.ok){
    throw new Error('API request failed with status '+resp.status);
  }
  const data = await resp.json();
  const text = (data.content||[])
    .filter(b=>b.type==='text')
    .map(b=>b.text).join('\n');
  return text;
}

function stripJsonFence(text){
  return text.replace(/```json/gi,'').replace(/```/g,'').trim();
}
function safeParseJson(text){
  try{ return JSON.parse(stripJsonFence(text)); }
  catch(e){
    // attempt to find the first {...} or [...] block
    const match = text.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
    if(match){
      try{ return JSON.parse(match[1]); }catch(e2){}
    }
    return null;
  }
}

/* ---- Report extraction ---- */
const EXTRACTION_SYSTEM = `You are a clinical document extraction engine embedded in a patient record tool.
You will be given the text (or an image/PDF) of a medical/lab report.
Extract ONLY what is explicitly present in the source. Never invent, estimate, or infer a reference range,
test value, date, or unit that is not stated in the document. If a field is not present, use null.
Respond with ONLY valid JSON (no markdown fences, no commentary) matching exactly this schema:
{
  "report_date": string|null,           // date as written in the report, ISO format if possible, else null
  "report_type": string|null,           // e.g. "Complete Blood Count", "Lipid Panel", "Radiology Report"
  "tests": [
    {
      "name": string,
      "value": string|null,             // keep as written, numeric parsing is done separately
      "unit": string|null,
      "ref_range_raw": string|null,     // exactly as written, e.g. "70-99" or "<200"
      "ref_low": number|null,           // numeric low bound ONLY if explicitly derivable from ref_range_raw
      "ref_high": number|null,          // numeric high bound ONLY if explicitly derivable from ref_range_raw
      "confidence": number              // 0-1, your confidence this was extracted correctly
    }
  ],
  "observations": string|null,          // free-text narrative findings/impressions, verbatim or lightly cleaned
  "observations_confidence": number,    // 0-1
  "overall_confidence": number          // 0-1, overall confidence in this extraction
}
If the document contains no identifiable lab/report data, return tests: [] and explain nothing else.`;

async function extractReport({rawText, fileBase64, fileMediaType}){
  const userContent = [];
  if(fileBase64 && fileMediaType){
    if(fileMediaType==='application/pdf'){
      userContent.push({type:'document', source:{type:'base64', media_type:fileMediaType, data:fileBase64}});
    } else {
      userContent.push({type:'image', source:{type:'base64', media_type:fileMediaType, data:fileBase64}});
    }
    userContent.push({type:'text', text:'Extract the structured data from this medical report per the schema.'});
  } else {
    userContent.push({type:'text', text:'Extract the structured data from this medical report text:\n\n'+rawText});
  }
  const text = await callClaude([{role:'user', content:userContent}], {system:EXTRACTION_SYSTEM, maxTokens:1800});
  const json = safeParseJson(text);
  return json;
}

/* ---- Conflict / inconsistency detection (AI-assisted) ---- */
const CONFLICT_SYSTEM = `You are a clinical-safety review assistant. You will receive a structured patient record
(conditions, allergies, medications, symptoms, and lab findings). Identify POTENTIAL inconsistencies or
notable interactions for a human clinician to review — for example a prescribed medication that overlaps
with a stated allergy, medications that are typically contraindicated together, or lab findings that
seem to conflict with stated conditions or symptoms. You are NOT diagnosing and NOT recommending any
treatment or dosage change. Respond with ONLY valid JSON: an array of objects:
[{"severity":"high"|"medium"|"low", "description": string}]
If you find nothing notable, respond with []. Keep each description to one or two sentences and always
frame findings as something to verify with a clinician, never as fact.`;

async function detectAiConflicts(patient){
  const payload = {
    conditions: patient.info.conditions,
    allergies: patient.info.allergies,
    medications: patient.info.medications,
    symptoms: patient.info.symptoms,
    tests: (patient.reports||[]).flatMap(r => (r.tests||[]).map(t => ({name:t.name, value:t.value, unit:t.unit, flag:t.flag}))),
    observations: (patient.reports||[]).map(r=>r.observations && r.observations.text).filter(Boolean)
  };
  const text = await callClaude(
    [{role:'user', content:[{type:'text', text:'Patient record JSON:\n'+JSON.stringify(payload)}]}],
    {system:CONFLICT_SYSTEM, maxTokens:900}
  );
  const json = safeParseJson(text);
  return Array.isArray(json) ? json : [];
}

/* ---- Patient-friendly summary ---- */
const SUMMARY_SYSTEM = `You write short, warm, plain-language summaries of a patient's organized medical
information for the patient themselves to read. Rules you must always follow:
- Never provide a diagnosis, never suggest a treatment, never suggest medication or dosage changes.
- Never state a value is dangerous or safe — only restate whether it was flagged low/normal/high per the
  provided reference range, using neutral language.
- Keep it under 220 words, second person ("you"/"your"), plain sentences, no medical jargon left unexplained.
- If information is incomplete, say so plainly rather than filling gaps.
- End with a short line encouraging the person to discuss the details with their clinician.
Respond with plain text only, no markdown headers, no JSON.`;

async function generateSummary(patient){
  const payload = {
    info: patient.info,
    reports: (patient.reports||[]).map(r=>({
      date:r.date, type:r.label,
      tests:(r.tests||[]).map(t=>({name:t.name,value:t.value,unit:t.unit,flag:t.flag})),
      observations: r.observations ? r.observations.text : null
    }))
  };
  const text = await callClaude(
    [{role:'user', content:[{type:'text', text:'Structured patient record:\n'+JSON.stringify(payload)}]}],
    {system:SUMMARY_SYSTEM, maxTokens:500}
  );
  return text.trim();
}

/* =========================================================================
   DOMAIN LOGIC
   ========================================================================= */
function computeFlag(value, refLow, refHigh){
  const v = num(value);
  if(v===null || (refLow===null && refHigh===null)) return 'unknown';
  if(refLow!==null && v<refLow) return 'low';
  if(refHigh!==null && v>refHigh) return 'high';
  return 'normal';
}

function ruleBasedConflicts(patient){
  const out=[];
  const allergies = (patient.info.allergies||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const meds = (patient.info.medications||'').split(',').map(s=>s.trim()).filter(Boolean);
  meds.forEach(med=>{
    allergies.forEach(al=>{
      if(al.length>2 && med.toLowerCase().includes(al)){
        out.push({
          id:uid('conf'), source:'rule', severity:'high', status:'open', createdAt: nowIso(),
          description: `Medication "${med}" overlaps with a stated allergy ("${al}"). Verify with a clinician before continuing this medication.`
        });
      }
    });
  });
  // duplicate medication entries
  const seen={};
  meds.forEach(med=>{
    const k = med.toLowerCase();
    if(seen[k]) out.push({
      id:uid('conf'), source:'rule', severity:'low', status:'open', createdAt: nowIso(),
      description: `Medication "${med}" appears more than once in the medication list — check for duplicate entry.`
    });
    seen[k]=true;
  });
  return out;
}

function buildTrends(patient){
  // group tests by name across reports, chronologically, return latest movement
  const byName={};
  (patient.reports||[]).slice().sort((a,b)=>new Date(a.date||0)-new Date(b.date||0)).forEach(r=>{
    (r.tests||[]).forEach(t=>{
      const v = num(t.value);
      if(v===null) return;
      const key = t.name.trim().toLowerCase();
      if(!byName[key]) byName[key]=[];
      byName[key].push({date:r.date, value:v, unit:t.unit, flag:t.flag, name:t.name});
    });
  });
  const trends=[];
  Object.values(byName).forEach(series=>{
    if(series.length>=2){
      const first=series[series.length-2], last=series[series.length-1];
      let dir='flat';
      if(last.value>first.value) dir='up';
      else if(last.value<first.value) dir='down';
      trends.push({name:last.name, unit:last.unit, from:first.value, to:last.value, dir, points:series});
    }
  });
  return trends;
}

async function refreshConflictsFromApi(patient){
  const pid = currentPatientId || (patient ? patient.id : null);
  if(!authToken || !pid) return (patient ? patient.conflicts : []) || [];
  try{
    const resp = await fetch(`http://localhost:4000/api/patients/${pid}/conflicts`, {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    if(resp.ok){
      const data = await resp.json();
      const realConflicts = (data.conflicts || []).map(c=>({
        id: c.id,
        source: c.detected_by === 'rule_engine' || c.detected_by === 'rule' ? 'rule' : 'ai',
        severity: c.type === 'allergy_medication' ? 'high' : 'medium',
        status: c.status || 'open',
        createdAt: c.created_at || nowIso(),
        description: c.description || c.type
      }));
      if(patient) patient.conflicts = realConflicts;
      return realConflicts;
    }
  }catch(e){
    console.warn('Failed to fetch conflicts from API', e);
  }
  return (patient ? patient.conflicts : []) || [];
}

async function createPatient(info){
  let apiPatientId = null;
  if(authToken){
    try {
      const resp = await fetch('http://localhost:4000/api/patients', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken
        },
        body: JSON.stringify({
          age: Number(info.age),
          sex: String(info.sex)
        })
      });
      if(resp.ok){
        const resData = await resp.json();
        apiPatientId = resData.patient ? resData.patient.id : resData.id;
        currentPatientId = apiPatientId;

        // Automatically grant consent for ai_document_processing so subsequent document processing succeeds
        await fetch(`http://localhost:4000/api/patients/${apiPatientId}/consent`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + authToken
          },
          body: JSON.stringify({ consent_type: 'ai_document_processing' })
        }).catch(()=>{});

        if(info.allergies){
          const list = info.allergies.split(',').map(s=>s.trim()).filter(Boolean);
          for(const allergen of list){
            await fetch(`http://localhost:4000/api/patients/${apiPatientId}/allergies`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
              body: JSON.stringify({ allergen })
            }).catch(()=>{});
          }
        }

        if(info.medications){
          const list = info.medications.split(',').map(s=>s.trim()).filter(Boolean);
          for(const medication_name of list){
            await fetch(`http://localhost:4000/api/patients/${apiPatientId}/medications`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
              body: JSON.stringify({ medication_name })
            }).catch(()=>{});
          }
        }
      } else {
        console.error('API create patient failed', await resp.text());
      }
    } catch(err) {
      console.error('API create patient error', err);
    }
  }

  const id = apiPatientId || uid('pt');
  currentPatientId = id;
  const record = {
    id, createdAt: nowIso(), updatedAt: nowIso(),
    info: Object.assign({source:'user', updatedAt: nowIso()}, info),
    reports: [], conflicts: [], summaries: [], audit:[{ts:nowIso(), action:'Patient record created', detail:info.name}]
  };
  S.patientCache[id]=record;
  S.patientsIndex.unshift({id, name:info.name, age:info.age, sex:info.sex, createdAt:record.createdAt, updatedAt:record.updatedAt});
  await Store.set('p:'+id, record);
  await saveIndex();
  return record;
}
async function deletePatient(id){
  await Store.delete('p:'+id);
  S.patientsIndex = S.patientsIndex.filter(p=>p.id!==id);
  delete S.patientCache[id];
  await saveIndex();
}

function kvItem(label, value, emptyLabel){
  const isEmpty = !value || !String(value).trim();
  return `<div class="kv-item"><div class="kv-label">${escapeHtml(label)}</div>
    <div class="kv-val ${isEmpty?'empty':''}">${isEmpty? (emptyLabel||'Not recorded') : escapeHtml(value)}</div></div>`;
}

function cleanListString(val){
  if(!val) return val;
  let str = String(val).trim();
  const len = str.length;
  if(len > 4 && len % 2 === 0 && str.slice(0, len/2) === str.slice(len/2)){
    str = str.slice(0, len/2);
  }
  const parts = str.split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  const unique = [];
  for(const p of parts){
    let cleanP = p;
    const pLen = cleanP.length;
    if(pLen > 4 && pLen % 2 === 0 && cleanP.slice(0, pLen/2) === cleanP.slice(pLen/2)){
      cleanP = cleanP.slice(0, pLen/2);
    }
    if(!unique.includes(cleanP)) unique.push(cleanP);
  }
  return unique.length ? unique.join(', ') : str;
}

function renderLatestSnapshot(patient){
  const latest = (patient.reports||[]).slice().sort((a,b)=>new Date(b.date||0)-new Date(a.date||0))[0];
  if(!latest) return `<div class="card" style="color:var(--ink-faint);">No reports uploaded yet. Add one from the Reports tab.</div>`;
  const tests = latest.tests||[];
  if(tests.length===0) return `<div class="card" style="color:var(--ink-faint);">Most recent report has no extracted test values.</div>`;
  return `<div class="card">
    <div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:10px;">From ${escapeHtml(latest.label||'report')} · ${fmtDateShort(latest.date)}</div>
    <table class="data-table">
      <thead><tr><th>Test</th><th>Value</th><th>Reference range</th><th>Flag</th><th>Provenance</th></tr></thead>
      <tbody>
        ${tests.map(t=>`<tr>
          <td>${escapeHtml(t.name)}</td>

}

function flagPill(flag){
  return `<span class="flag-pill flag-${flag}"><span class="dot"></span>${escapeHtml(flag||'—')}</span>`;
}

function renderTrendsBlock(patient){
  const trends = buildTrends(patient);
  if(trends.length===0) return `<div class="card" style="color:var(--ink-faint);">Add at least two reports containing the same test to see trends over time.</div>`;
  return `<div class="card">
    <table class="data-table">
      <thead><tr><th>Test</th><th>Previous</th><th>Latest</th><th>Change</th></tr></thead>
      <tbody>
        ${trends.map(t=>`<tr>
          <td>${escapeHtml(t.name)}</td>
          <td class="mono">${t.from} ${escapeHtml(t.unit||'')}</td>
          <td class="mono">${t.to} ${escapeHtml(t.unit||'')}</td>
          <td><span class="trend ${t.dir}">${t.dir==='up'?'▲ increased':t.dir==='down'?'▼ decreased':'— unchanged'}</span></td>

/* ---------------- Reports tab ---------------- */
function renderReportsTab(body, patient){
  body.innerHTML = `
    <section class="block no-print">
      <div class="block-head"><h3>Add a medical report</h3></div>
      <div class="block-sub">Paste report text, or upload an image/PDF. Extraction is AI-assisted and clearly labeled; reference ranges are only used when explicitly present in the source.</div>
      <div class="card">
        <div class="field"><label for="reportLabel">Report label</label><input id="reportLabel" placeholder="e.g. Lipid Panel — Apollo Diagnostics" /></div>
        <div class="field"><label for="reportDate">Report date</label><input id="reportDate" type="date" /></div>
        <div class="field"><label for="reportText">Paste report text</label><textarea id="reportText" placeholder="Paste the raw report text here…" style="min-height:120px;"></textarea></div>
        <div class="field">
          <label>Or upload a file (image or PDF)</label>
          <label class="file-drop" id="dropZone">
            <div id="dropLabel">Click to choose a file, or drop it here</div>
            <input type="file" id="fileInput" accept="image/*,.pdf" />
          </label>
        </div>
        <div id="reportBanner"></div>
        <div class="row-actions">
          <button class="btn" id="extractBtn">Extract with AI</button>
        </div>
      </div>
    </section>
    <section class="block">
      <div class="block-head"><h3>Reports on file (${(patient.reports||[]).length})</h3></div>
      <div id="reportsList"></div>
    </section>
  `;

  const fileInput = document.getElementById('fileInput');
  const dropLabel = document.getElementById('dropLabel');
  fileInput.onchange = ()=>{
    const f = fileInput.files[0];
    if(!f) return;
    dropLabel.textContent = 'Selected: '+f.name;
  };

  document.getElementById('extractBtn').onclick = async ()=>{
    const banner = document.getElementById('reportBanner');
    const rawText = document.getElementById('reportText').value.trim();
    const label = document.getElementById('reportLabel').value.trim() || 'Untitled report';
    const dateVal = document.getElementById('reportDate').value || null;
    const selectedFile = fileInput.files ? fileInput.files[0] : null;

    if(!rawText && !selectedFile){
      banner.innerHTML = `<div class="banner error">Paste report text or choose a file before extracting.</div>`;
      return;
    }
    banner.innerHTML = `<div class="banner loading">Uploading and extracting structured data with backend API…</div>`;
    try{
      const pid = currentPatientId || patient.id;
      const formData = new FormData();
      if(selectedFile){
        formData.append('file', selectedFile);
      } else {
        const textBlob = new Blob([rawText], { type: 'text/plain' });
        formData.append('file', textBlob, 'report.txt');
        formData.append('raw_extracted_text', rawText);
      }

      // Step 1: Upload to server
      const uploadResp = await fetch(`http://localhost:4000/api/patients/${pid}/upload`, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + authToken
        },
        body: formData
      });
      if(!uploadResp.ok){
        const err = await uploadResp.text();
        throw new Error('Upload failed: ' + err);
      }
      const uploadData = await uploadResp.json();
      const docId = uploadData.document.id;

      // Step 2: Process document via backend
      const processResp = await fetch(`http://localhost:4000/api/documents/${docId}/process`, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + authToken
        }
      });
      if(!processResp.ok){
        const err = await processResp.text();
        throw new Error('Extraction failed: ' + err);
      }
      const processData = await processResp.json();
      const rawTests = processData.tests || [];

      const tests = rawTests.map(t=>({
        id: t.id || uid('test'),
        name: t.test_name || 'Unnamed test',
        value: t.value !== undefined ? t.value : null,
        numeric_value: t.numeric_value,
        unit: t.unit || '',
        refRangeRaw: t.reference_range_raw || null,
        refLow: t.reference_range_low,
        refHigh: t.reference_range_high,
        flag: t.range_status || 'normal',
        range_status: t.range_status || 'normal',
        confidence: typeof t.confidence === 'number' ? t.confidence : 0.6,
        source: t.source || 'ai_extracted',
        extraction_method: t.extraction_method || 'ai'
      }));

      const report = {
        id: docId,
        label,
        date: dateVal || nowIso().slice(0,10),
        rawText: rawText || (selectedFile ? `[Source: uploaded file — ${selectedFile.name}]` : ''),
        extractedAt: nowIso(),
        tests,
        observations: processData.observations ? { text: processData.observations, source: 'ai', confidence: 0.5 } : null,
        overallConfidence: tests.length ? (tests.reduce((acc, c)=>acc+(c.confidence||0), 0) / tests.length) : 0.6,
        source: tests[0] ? tests[0].source : 'derived_rule',
        extraction_method: tests[0] ? tests[0].extraction_method : 'regex_fallback'
      };

      patient.reports = patient.reports || [];
      patient.reports.unshift(report);
      await appendAudit(patient, 'Report added via API', label+' ('+tests.length+' test values extracted)');

      await refreshConflictsFromApi(patient);
      await Store.set('p:'+patient.id, patient);

      banner.innerHTML = `<div class="banner info">Report processed successfully with ${tests.length} extracted value(s). Review below.</div>`;
      renderReportsTab(body, patient);
    }catch(err){
      console.error(err);
      banner.innerHTML = `<div class="banner error">Something went wrong calling the extraction API: ${escapeHtml(err.message||'unknown error')}.</div>`;
    }
  };

  renderReportsList(document.getElementById('reportsList'), patient);
}

}

function openTestEditor(patient, reportId, testId, onDone){
  const report = patient.reports.find(r=>r.id===reportId);
  const test = report.tests.find(t=>t.id===testId);
  const row = document.querySelector(`tr[data-testrow="${testId}"]`);
  if(!row) return;
  row.innerHTML = `
    <td><input class="edit-input" id="e_name" value="${escapeHtml(test.name)}"/></td>
    <td><input class="edit-input" id="e_value" value="${escapeHtml(test.value===null?'':test.value)}" style="width:70px;display:inline-block;"/> <input class="edit-input" id="e_unit" value="${escapeHtml(test.unit||'')}" style="width:60px;display:inline-block;"/></td>
    <td><input class="edit-input" id="e_ref" value="${escapeHtml(test.refRangeRaw||'')}" placeholder="e.g. 70-99"/></td>
    <td colspan="2"><button class="btn-quiet icon-btn" id="e_save">Save</button> <button class="btn-quiet icon-btn" id="e_cancel">Cancel</button></td>
    <td></td>
  `;
  document.getElementById('e_cancel').onclick=()=>onDone();
  document.getElementById('e_save').onclick=async ()=>{
    test.name = document.getElementById('e_name').value.trim() || test.name;
    test.value = document.getElementById('e_value').value.trim();
    test.unit = document.getElementById('e_unit').value.trim();
    const refRaw = document.getElementById('e_ref').value.trim();
    test.refRangeRaw = refRaw || null;
    const parts = refRaw.match(/(-?\d+(\.\d+)?)\s*-\s*(-?\d+(\.\d+)?)/);
    if(parts){ test.refLow = parseFloat(parts[1]); test.refHigh = parseFloat(parts[3]); }
    else { test.refLow = null; test.refHigh = null; }
    test.flag = computeFlag(test.value, test.refLow, test.refHigh);
    test.source = 'user-edited';
    await appendAudit(patient, 'Edited extracted value', `${test.name} in report "${report.label}"`);
    onDone();
  };
}

function renderConflictsList(el, patient){
  const conflicts = (patient.conflicts||[]).slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(conflicts.length===0){ el.innerHTML = `<div style="color:var(--ink-faint);">No conflicts recorded. Run a check above, or they'll appear automatically as rule-based checks run when reports/medications change.</div>`; return; }
  el.innerHTML = conflicts.map(c=>`
    <div class="conflict-item">
      <div class="sev-badge sev-${c.severity}">${c.severity}</div>
      <div style="flex:1;">
        <div style="font-size:13.5px;">${escapeHtml(c.description)}</div>
        <div style="margin-top:4px;">
          <span class="prov ${c.source==='ai'?'ai':''}">${c.source==='ai'?'AI-detected':'Rule-based'}</span>
          <span style="font-size:11.5px;color:var(--ink-faint);margin-left:8px;">${fmtDateShort(c.createdAt)} · ${c.status}</span>
        </div>
      </div>
      <div class="no-print">
        ${c.status!=='reviewed' ? `<button class="btn-quiet icon-btn" data-review="${c.id}">Mark reviewed</button>` : `<span style="font-size:11.5px;color:var(--ink-faint);">✓ reviewed</span>`}
      </div>
    </div>
  `).join('');
  el.querySelectorAll('[data-review]').forEach(b=>{
    b.onclick=async ()=>{
      const c = patient.conflicts.find(x=>x.id===b.dataset.review);
      c.status='reviewed';
      await appendAudit(patient, 'Conflict marked reviewed', c.description);
      renderConflictsList(el, patient);
    };
  });
}

/* ---------------- Timeline tab ---------------- */
function renderTimelineTab(body, patient){
  const audit = patient.audit||[];
  body.innerHTML = `
    <section class="block">
      <div class="block-head"><h3>Audit history</h3></div>
      <div class="block-sub">Every intake edit, extraction, and review action is logged here for traceability.</div>
      <div class="timeline">
        ${audit.length===0 ? '<div style="color:var(--ink-faint);">No activity yet.</div>' : audit.map(a=>`
          <div class="timeline-item">
            <div class="timeline-ts">${fmtDate(a.ts)}</div>
            <div class="timeline-action"><strong>${escapeHtml(a.action)}</strong>${a.detail? ' — '+escapeHtml(a.detail):''}</div>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

/* ---------------- Summary tab ---------------- */
function renderSummaryTab(body, patient){
  const summaries = (patient.summaries||[]).slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const latest = summaries[0];
  body.innerHTML = `
    <section class="block no-print">
      <div class="block-head"><h3>AI-generated patient summary</h3></div>
      <div class="block-sub">A plain-language recap of the information on file. Never a diagnosis or treatment recommendation.</div>
      <button class="btn" id="genSummary">${latest? 'Regenerate summary' : 'Generate summary'}</button>
      <div id="summaryBanner"></div>
    </section>
    <section class="block" id="summaryBlock"></section>
    ${summaries.length>1 ? `
    <section class="block">
      <div class="block-head"><h3>Previous summaries (${summaries.length-1})</h3></div>
      <div class="timeline">
        ${summaries.slice(1).map(s=>`<div class="timeline-item"><div class="timeline-ts">${fmtDate(s.createdAt)}</div><div class="timeline-action">${escapeHtml(s.text)}</div></div>`).join('')}
      </div>
    </section>` : ''}
  `;
  renderSummaryBlock(document.getElementById('summaryBlock'), latest);
  document.getElementById('genSummary').onclick = async ()=>{
    const banner = document.getElementById('summaryBanner');
    banner.innerHTML = `<div class="banner loading">Writing a plain-language summary…</div>`;
    try{
      const text = await generateSummary(patient);
      const entry = {id:uid('sum'), text, createdAt: nowIso(), source:'ai'};
      patient.summaries = patient.summaries||[];
      patient.summaries.unshift(entry);
      await appendAudit(patient, 'Summary generated', '');
      await Store.set('p:'+patient.id, patient);
      banner.innerHTML = '';
      renderSummaryTab(body, patient);
    }catch(err){
      banner.innerHTML = `<div class="banner error">Could not generate a summary: ${escapeHtml(err.message||'unknown error')}</div>`;
    }
  };
}

function renderSummaryBlock(el, latest){
  if(!latest){ el.innerHTML = `<div class="card" style="color:var(--ink-faint);">No summary generated yet.</div>`; return; }
  el.innerHTML = `
    <div class="summary-box">
      ${escapeHtml(latest.text)}
      <div class="disclaimer">
        <strong>Not a diagnosis.</strong> This summary restates information already on file in plain
        language and does not diagnose conditions, recommend treatment, or suggest medication changes.
        Always discuss your full record with a qualified clinician. <span class="prov ai">AI-generated</span> · ${fmtDate(latest.createdAt)}
      </div>
    </div>
    <div class="row-actions no-print" style="margin-top:10px;">
      <button class="btn-outline btn" id="copySummary">Copy text</button>
    </div>
  `;
  const copyBtn = document.getElementById('copySummary');
  if(copyBtn) copyBtn.onclick = ()=>{
    navigator.clipboard.writeText(latest.text).then(()=>{
      copyBtn.textContent='Copied ✓'; setTimeout(()=>copyBtn.textContent='Copy text', 1500);
    });
  };
}

/* ---------------- Edit intake modal (simple inline replace of overview) ---------------- */
function renderEditInfoModal(patient){
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(29,43,46,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;';
  overlay.innerHTML = `
    <div class="gate-card" style="max-width:520px;max-height:86vh;overflow:auto;">
      <h3 style="margin-bottom:16px;">Edit intake information</h3>
      <div class="field"><label>Symptoms</label><textarea id="m_symptoms">${escapeHtml(patient.info.symptoms||'')}</textarea></div>
      <div class="field"><label>Existing conditions</label><textarea id="m_conditions">${escapeHtml(patient.info.conditions||'')}</textarea></div>
      <div class="field"><label>Allergies</label><input id="m_allergies" value="${escapeHtml(patient.info.allergies||'')}" /></div>
      <div class="field"><label>Medications</label><input id="m_meds" value="${escapeHtml(patient.info.medications||'')}" /></div>
      <div class="field"><label>Other notes</label><textarea id="m_notes">${escapeHtml(patient.info.notes||'')}</textarea></div>
      <div class="row-actions">
        <button class="btn" id="m_save">Save changes</button>
        <button class="btn btn-outline" id="m_cancel">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#m_cancel').onclick=()=>overlay.remove();
  overlay.querySelector('#m_save').onclick=async ()=>{
    patient.info.symptoms = document.getElementById('m_symptoms').value.trim();
    patient.info.conditions = document.getElementById('m_conditions').value.trim();
    patient.info.allergies = document.getElementById('m_allergies').value.trim();
    patient.info.medications = document.getElementById('m_meds').value.trim();
    patient.info.notes = document.getElementById('m_notes').value.trim();
    patient.info.updatedAt = nowIso();
    patient.conflicts = (patient.conflicts||[]).filter(c=>c.source!=='rule').concat(ruleBasedConflicts(patient));
    await appendAudit(patient, 'Intake information edited', '');
    const idxEntry = S.patientsIndex.find(p=>p.id===patient.id);
    if(idxEntry) idxEntry.updatedAt = patient.updatedAt;
    await saveIndex();
    overlay.remove();
    renderShell();
  };
}

/* ---------------- Global search ---------------- */
async function renderGlobalSearch(main){
  main.innerHTML = `
    <h2>Search across all records</h2>
    <div class="block-sub">Searches names, symptoms, conditions, medications, allergies, test names, and observations.</div>
    <div class="field" style="max-width:420px;margin-top:14px;"><input id="gsInput" placeholder="e.g. metformin, glucose, headache…" value="${escapeHtml(S.globalSearchQuery)}"/></div>
    <div id="gsResults" style="margin-top:18px;"></div>
  `;
  const input = document.getElementById('gsInput');
  const runSearch = debounce(async ()=>{
    const q = input.value.trim().toLowerCase();
    S.globalSearchQuery = q;
    const results = [];
    if(q.length>=2){
      for(const p of S.patientsIndex){
        const patient = await loadPatient(p.id);
        if(!patient) continue;
        const hay = [
          patient.info.name, patient.info.symptoms, patient.info.conditions,
          patient.info.allergies, patient.info.medications, patient.info.notes
        ].join(' ').toLowerCase();
        if(hay.includes(q)){
          results.push({patient, context:'Intake information matched.'});
        }
        (patient.reports||[]).forEach(r=>{
          (r.tests||[]).forEach(t=>{
            if((t.name||'').toLowerCase().includes(q)){
              results.push({patient, context:`Test "${t.name}" in ${r.label} (${fmtDateShort(r.date)}) = ${t.value} ${t.unit||''}`});
            }
          });
          if(r.observations && r.observations.text.toLowerCase().includes(q)){
            results.push({patient, context:`Observation in ${r.label}: "${r.observations.text.slice(0,120)}…"`});
          }
        });
      }
    }
    const el = document.getElementById('gsResults');
    if(q.length<2){ el.innerHTML=`<div style="color:var(--ink-faint);">Type at least 2 characters.</div>`; return; }
    if(results.length===0){ el.innerHTML=`<div style="color:var(--ink-faint);">No matches.</div>`; return; }
    el.innerHTML = results.map(r=>`
      <div class="search-hit">
        <div class="sh-pt"><button class="btn-quiet icon-btn" data-goto="${r.patient.id}" style="padding:0;">${escapeHtml(r.patient.info.name)}</button></div>
        <div class="sh-ctx">${escapeHtml(r.context)}</div>
      </div>`).join('');
    el.querySelectorAll('[data-goto]').forEach(b=>{
      b.onclick=async ()=>{ S.activePatientId=b.dataset.goto; S.view='patient'; S.activeTab='overview'; await loadPatient(S.activePatientId); renderShell(); };
    });
  }, 250);
  input.oninput = runSearch;
  input.focus();
}

/* =========================================================================
   INIT
   ========================================================================= */
async function init(){
  const hash = await Store.get('auth-hash');
  if(!hash){
    S.screen='setup';
  } else {
    S.passcodeHash = hash;
    S.screen='lock';
  }
  render();
}

init();

})();
</script>
